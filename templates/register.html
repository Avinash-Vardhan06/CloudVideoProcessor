
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CloudVideoProcessor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101b3f, #2456a6);
            padding: 20px;
        }

        .register-container {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #172554;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
            color: #dc2626;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 14px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">☁️</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join CloudVideoProcessor today
        </p>

        <form id="registerForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter your password"
                minlength="6"
                required
            >

            <button type="submit" id="registerButton">
                Create Account
            </button>

            <p id="message"></p>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

    <script type="module">

        import {
            registerUser,
            getUserToken
        } from "/static/js/firebase.js";

        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            if (password.length < 6) {
                message.textContent =
                    "Password must contain at least 6 characters.";
                return;
            }

            button.disabled = true;
            message.style.color = "#2563eb";
            message.textContent = "Creating your account...";

            try {

                // Step 1: Create Firebase Authentication account
                await registerUser(email, password);

                // Step 2: Get Firebase ID token
                const token = await getUserToken();

                // Step 3: Save profile in Firestore through Flask
                const response = await fetch("/api/profile", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },

                    body: JSON.stringify({
                        name: name
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message || "Could not save user profile."
                    );
                }

                message.style.color = "#16a34a";
                message.textContent =
                    "Account created successfully! Redirecting...";

                setTimeout(function() {
                    window.location.href = "/dashboard";
                }, 1000);

            } catch (error) {

                console.error("Registration error:", error);

                const errorMessages = {
                    "auth/email-already-in-use":
                        "This email is already registered.",
                    "auth/invalid-email":
                        "Please enter a valid email address.",
                    "auth/weak-password":
                        "Please choose a stronger password.",
                    "auth/unauthorized-domain":
                        "This website domain is not authorized in Firebase."
                };

                message.style.color = "#dc2626";

                message.textContent =
                    errorMessages[error.code] ||
                    error.message ||
                    "Registration failed. Please try again.";

            } finally {

                button.disabled = false;

            }

        });

    </script>

</body>
</html>
